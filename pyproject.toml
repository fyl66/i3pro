[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "i3pro"
version = "0.1.0"
description = "MoTeC .ld telemetry toolkit: native parser, Parquet store, GPS lap analysis, browser workbench"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
i3pro = "i3pro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
i3pro = ["web/*.html"]
